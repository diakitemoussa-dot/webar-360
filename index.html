<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>360° Immersive Experience</title>
  <meta name="description" content="Web AR experience with a 360° panorama" />
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }

    #hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 500;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px; pointer-events: none;
      background: linear-gradient(to bottom, rgba(0,0,0,.55), transparent);
      color: #fff;
    }
    #hud .title { font-size: 1rem; font-weight: 600; letter-spacing: 1px; }
    #hud .hint { font-size: .72rem; opacity: .75; }

    #helpBtn {
      position: fixed; bottom: 20px; right: 20px; z-index: 500;
      width: 44px; height: 44px; border-radius: 50%;
      border: none; background: rgba(255,255,255,.15);
      color: #fff; font-size: 1.3rem; cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background .2s;
    }
    #helpBtn:hover { background: rgba(255,255,255,.3); }

    #infoPanel {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 600;
      background: rgba(10, 25, 35, .92); color: #fff;
      padding: 22px 26px; transform: translateY(110%);
      transition: transform .4s cubic-bezier(.22,1,.36,1);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(79,195,247,.35);
    }
    #infoPanel.open { transform: translateY(0); }
    #infoPanel h2 { color: #4fc3f7; margin-bottom: .5em; font-size: 1.05rem; }
    #infoPanel p { font-size: .85rem; line-height: 1.6; opacity: .85; max-width: 560px; }

    a-scene { position: fixed; inset: 0; }
    .enter-vr { pointer-events: auto !important; }
  </style>
</head>
<body>

  <div id="hud">
    <div>
      <div class="title">🌍 360° EXPERIENCE</div>
      <div class="hint">Drag / move phone to look around</div>
    </div>
  </div>

  <button id="helpBtn" title="Info">i</button>

  <div id="infoPanel">
    <h2>About this experience</h2>
    <p>This is a Web AR site powered by A-Frame and WebXR. The 360° panorama is projected inside a sphere around you. Tap the VR goggles icon to enter immersive mode on a compatible device (Cardboard, Quest, etc.).</p>
  </div>

  <a-scene
    loading-screen="enabled: false"
    renderer="colorManagement: true"
    embedded
    vr-mode-ui="enabled: true">

    <a-assets>
      <img id="pano" src="assets/panorama.jpg" crossorigin="anonymous" />
    </a-assets>

    <!-- 360° sky sphere (inverted normals) -->
    <a-sky src="#pano" rotation="0 -90 0"></a-sky>

    <!-- Subtle floating hotspot -->
    <a-entity id="hotspot" geometry="primitive: ring; radiusInner: 0.08; radiusOuter: 0.12"
              material="color: #4fc3f7; shader: flat; opacity: 0.9"
              position="0 0 -4" animation__pulse="property: scale; to: 1.25 1.25 1.25; dir: alternate; dur: 1200; loop: true; easing: easeInOutSine"
              event-set__enter="_event: mouseenter; scale: 1.5 1.5 1.5"
              event-set__leave="_event: mouseleave; scale: 1 1 1">
      <a-text value="Look around!" align="center" color="#ffffff" width="3" position="0 0.35 0"></a-text>
    </a-entity>

    <a-entity camera look-controls="pointerLockEnabled: false"
              device-orientation-permission-ui="enabled: true">
      <a-cursor fuse="true" fusetimeout="800"
                geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.012"
                material="color: #4fc3f7; shader: flat; opacity: 0.8"
                position="0 0 -1"
                animation__click="property: scale; startEvents: click; from: 1 1 1; to: 2 2 2; dur: 150"></a-cursor>
    </a-entity>

  </a-scene>

  <script>
    const helpBtn = document.getElementById('helpBtn');
    const panel = document.getElementById('infoPanel');
    helpBtn.addEventListener('click', () => panel.classList.toggle('open'));

    // Hide hotspot once the user starts looking around
    let moved = false;
    window.addEventListener('mousemove', () => { if (!moved) fadeHotspot(); });
    window.addEventListener('touchstart', () => { if (!moved) fadeHotspot(); }, { passive: true });

    function fadeHotspot() {
      moved = true;
      const h = document.getElementById('hotspot');
      if (h) h.setAttribute('animation__fade', 'property: material.opacity; to: 0; dur: 1000; startEvents: fadeNow');
    }
  </script>
</body>
</html>
